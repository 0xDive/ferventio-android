title = "Ferventio secret scanning"

[extend]
useDefault = true

# Twitch Client IDs are public identifiers. Restrict the exception to the
# explicitly named constant in the isolated private-GQL clients.
[[rules]]
id = "twitch-api-token"

  [[rules.allowlists]]
  description = "Public Twitch web Client ID"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^app/src/main/kotlin/io/ferventio/app/twitch/TwitchPinnedChatGqlClient\.kt$''',
    '''^app/src/main/kotlin/io/ferventio/app/twitch/TwitchUnofficialChattersClient\.kt$''',
    '''^shared/src/commonMain/kotlin/io/ferventio/shared/chat/TwitchPinnedChatSnapshotClient\.kt$'''
  ]
  regexes = [
    '''TWITCH_WEB_CLIENT_ID\s*='''
  ]

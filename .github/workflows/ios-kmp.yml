name: iOS KMP CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-kmp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Select supported Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify iOS privacy configuration guard
        run: |
          CONFIGURATION=Debug \
            sh ./iosApp/Scripts/verify-privacy-configuration.sh

          if CONFIGURATION=Release \
            sh ./iosApp/Scripts/verify-privacy-configuration.sh; then
            echo "Release privacy validation unexpectedly accepted missing metadata." >&2
            exit 1
          fi

          CONFIGURATION=Release \
            FERVENTIO_PRIVACY_OPERATOR_NAME="Ferventio CI" \
            FERVENTIO_PRIVACY_CONTACT="privacy@example.com" \
            FERVENTIO_PRIVACY_POLICY_URL="https://example.com/privacy" \
            sh ./iosApp/Scripts/verify-privacy-configuration.sh

          if CONFIGURATION=Release \
            FERVENTIO_PRIVACY_OPERATOR_NAME="Ferventio CI" \
            FERVENTIO_PRIVACY_CONTACT="privacy@example.com" \
            FERVENTIO_PRIVACY_POLICY_URL="http://example.com/privacy" \
            sh ./iosApp/Scripts/verify-privacy-configuration.sh; then
            echo "Release privacy validation unexpectedly accepted a non-HTTPS policy URL." >&2
            exit 1
          fi

      - name: Compile common domain for iOS simulator
        run: |
          ./gradlew \
            :core:domain:compileKotlinIosSimulatorArm64 \
            --no-configuration-cache \
            --stacktrace

      - name: Compile common domain for iOS device
        run: |
          ./gradlew \
            :core:domain:compileKotlinIosArm64 \
            --no-configuration-cache \
            --stacktrace

      - name: Link shared iOS simulator framework
        run: |
          ./gradlew \
            :shared:linkDebugFrameworkIosSimulatorArm64 \
            --no-configuration-cache \
            --stacktrace

      - name: Link shared iOS device framework
        run: |
          ./gradlew \
            :shared:linkDebugFrameworkIosArm64 \
            --no-configuration-cache \
            --stacktrace

      - name: Link shared iOS Release device framework
        run: |
          ./gradlew \
            :shared:linkReleaseFrameworkIosArm64 \
            --no-configuration-cache \
            --stacktrace

      - name: Verify shared framework outputs
        run: |
          SIMULATOR_FRAMEWORK="shared/build/bin/iosSimulatorArm64/debugFramework/FerventioShared.framework"
          DEVICE_FRAMEWORK="shared/build/bin/iosArm64/debugFramework/FerventioShared.framework"
          RELEASE_DEVICE_FRAMEWORK="shared/build/bin/iosArm64/releaseFramework/FerventioShared.framework"
          test -d "$SIMULATOR_FRAMEWORK"
          test -d "$DEVICE_FRAMEWORK"
          test -d "$RELEASE_DEVICE_FRAMEWORK"
          grep -R "MainViewController" "$SIMULATOR_FRAMEWORK/Headers"
          grep -R "MainViewController" "$DEVICE_FRAMEWORK/Headers"
          grep -R "MainViewController" "$RELEASE_DEVICE_FRAMEWORK/Headers"
          xcrun lipo -info "$DEVICE_FRAMEWORK/FerventioShared" | grep -q arm64
          xcrun lipo -info "$RELEASE_DEVICE_FRAMEWORK/FerventioShared" | grep -q arm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS application project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS application for simulator
        run: |
          xcodebuild \
            -project iosApp/Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Compose resources in simulator app bundle
        run: |
          APP_BUNDLE="build/ios-derived/Build/Products/Debug-iphonesimulator/Ferventio.app"
          test -d "$APP_BUNDLE/compose-resources"
          test -f "$APP_BUNDLE/compose-resources/composeResources/io.ferventio.shared.generated.resources/values/strings.commonMain.cvr"
          test -f "$APP_BUNDLE/compose-resources/composeResources/io.ferventio.shared.generated.resources/values-ru/strings.commonMain.cvr"

      - name: Build iOS application for device without signing
        run: |
          xcodebuild \
            -project iosApp/Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device-derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Compose resources in device app bundle
        run: |
          APP_BUNDLE="build/ios-device-derived/Build/Products/Debug-iphoneos/Ferventio.app"
          test -d "$APP_BUNDLE/compose-resources"
          test -f "$APP_BUNDLE/compose-resources/composeResources/io.ferventio.shared.generated.resources/values/strings.commonMain.cvr"
          test -f "$APP_BUNDLE/compose-resources/composeResources/io.ferventio.shared.generated.resources/values-ru/strings.commonMain.cvr"
          xcrun lipo -info "$APP_BUNDLE/Ferventio" | grep -q arm64

      - name: Build iOS Release application for device without signing
        run: |
          xcodebuild \
            -project iosApp/Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-release-device-derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            "FERVENTIO_PRIVACY_OPERATOR_NAME=Ferventio CI" \
            "FERVENTIO_PRIVACY_CONTACT=privacy@example.com" \
            "FERVENTIO_PRIVACY_POLICY_URL=https://example.com/privacy" \
            FERVENTIO_SHOW_PRIVACY_POLICY_IN_APP=YES \
            build

      - name: Verify iOS Release device app bundle
        run: |
          APP_BUNDLE="build/ios-release-device-derived/Build/Products/Release-iphoneos/Ferventio.app"
          INFO_PLIST="$APP_BUNDLE/Info.plist"
          test -d "$APP_BUNDLE/compose-resources"
          test -f "$APP_BUNDLE/compose-resources/composeResources/io.ferventio.shared.generated.resources/values/strings.commonMain.cvr"
          test -f "$APP_BUNDLE/compose-resources/composeResources/io.ferventio.shared.generated.resources/values-ru/strings.commonMain.cvr"
          xcrun lipo -info "$APP_BUNDLE/Ferventio" | grep -q arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :FerventioPrivacyOperatorName' "$INFO_PLIST")" = "Ferventio CI"
          test "$(/usr/libexec/PlistBuddy -c 'Print :FerventioPrivacyContact' "$INFO_PLIST")" = "privacy@example.com"
          test "$(/usr/libexec/PlistBuddy -c 'Print :FerventioPrivacyPolicyURL' "$INFO_PLIST")" = "https://example.com/privacy"

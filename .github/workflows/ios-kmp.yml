name: iOS KMP CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-kmp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Apple toolchain
        run: xcodebuild -version

      - name: Compile common domain for iOS simulator
        run: |
          ./gradlew \
            :core:domain:compileKotlinIosSimulatorArm64 \
            --no-configuration-cache \
            --stacktrace

      - name: Link shared iOS simulator framework
        run: |
          ./gradlew \
            :shared:linkDebugFrameworkIosSimulatorArm64 \
            --no-configuration-cache \
            --stacktrace

      - name: Verify shared framework output
        run: test -d shared/build/bin/iosSimulatorArm64/debugFramework/FerventioShared.framework

name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Bootstrap and verify Gradle Wrapper
        run: |
          ./gradlew --version
          echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Repository secret scan
        run: |
          python3 scripts/security/check-repository-secrets.py --root .
          python3 scripts/security/test-check-repository-secrets.py

      - name: Architecture boundaries
        run: |
          python3 scripts/architecture/check-module-boundaries.py --root .
          python3 scripts/architecture/check-kmp-boundaries.py --root .

      - name: Resource localization contract
        run: python3 scripts/localization/check_ui_localization.py

      - name: Compile isolated build logic
        run: ./gradlew -p build-logic clean check --no-configuration-cache --stacktrace

      - name: Git history secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile common domain
        run: |
          ./gradlew \
            :core:domain:compileCommonMainKotlinMetadata \
            --no-configuration-cache \
            --stacktrace

      - name: Compile shared common UI
        run: |
          ./gradlew \
            :shared:compileCommonMainKotlinMetadata \
            --no-configuration-cache \
            --stacktrace

      - name: Run KMP Android host tests
        run: |
          ./gradlew \
            :core:domain:testAndroidHostTest \
            :shared:testAndroidHostTest \
            --no-configuration-cache \
            --stacktrace

      - name: Verify auth persistence compatibility
        run: |
          ./gradlew \
            :app:testFossDebugUnitTest \
            --tests io.ferventio.app.data.AuthSessionPayloadCodecTest \
            --no-configuration-cache \
            --stacktrace

      - name: Android tests, lint, flavor isolation and debug builds
        run: |
          ./gradlew \
            :core:database:testDebugUnitTest \
            :core:database:lintDebug \
            :app:testFossDebugUnitTest \
            :app:testPlayDebugUnitTest \
            :app:lintFossDebug \
            :app:lintPlayDebug \
            :app:verifyFossNoGooglePushDependencies \
            :app:assembleFossDebug \
            :app:assemblePlayDebug \
            --no-configuration-cache \
            --stacktrace

      - name: Android unsigned Release package guard
        run: |
          ./gradlew \
            :app:lintFossRelease \
            :app:lintPlayRelease \
            :app:verifyFossNoGooglePushDependencies \
            :app:verifyPlayCrashReportingDependency \
            :app:assembleFossRelease \
            :app:bundlePlayRelease \
            -PFERVENTIO_PRIVACY_OPERATOR_NAME="Ferventio CI" \
            -PFERVENTIO_PRIVACY_CONTACT="privacy@example.com" \
            -PFERVENTIO_PRIVACY_POLICY_URL="https://example.com/privacy" \
            -PFERVENTIO_FIREBASE_APPLICATION_ID="1:1234567890:android:0123456789abcdef" \
            -PFERVENTIO_FIREBASE_PROJECT_ID="ferventio-ci" \
            -PFERVENTIO_FIREBASE_API_KEY="ferventio-test-only-api-value" \
            -PFERVENTIO_FIREBASE_SENDER_ID="1234567890" \
            -PFERVENTIO_CRASHLYTICS_MAPPING_ID="ferventio-test-only-mapping-value" \
            --no-configuration-cache \
            --stacktrace

          FOSS_APK="$(find app/build/outputs/apk/foss/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          PLAY_AAB="app/build/outputs/bundle/playRelease/app-play-release.aab"

          test -n "$FOSS_APK"
          test -s "$FOSS_APK"
          test -s "$PLAY_AAB"
          unzip -tqq "$FOSS_APK"
          unzip -tqq "$PLAY_AAB"
          unzip -l "$PLAY_AAB" | grep -q 'BundleConfig.pb'
          unzip -l "$PLAY_AAB" | grep -q 'base/manifest/AndroidManifest.xml'

          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$FOSS_APK" >/dev/null 2>&1; then
            echo "PR Release APK unexpectedly contains a production-capable signature." >&2
            exit 1
          fi

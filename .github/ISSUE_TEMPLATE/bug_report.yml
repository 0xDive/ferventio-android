name: Bug report
description: Report a reproducible Android problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version and flavor
      placeholder: 0.0.1-foss or 0.0.1-play
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, usernames, private messages and other personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I tested the latest beta and searched existing issues.
          required: true
        - label: I removed secrets and personal data.
          required: true

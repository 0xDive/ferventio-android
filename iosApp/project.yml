name: Ferventio

options:
  bundleIdPrefix: io.ferventio
  deploymentTarget:
    iOS: "16.0"

targets:
  Ferventio:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Ferventio
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Ferventio OAuth
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
        FerventioServerURL: $(FERVENTIO_SERVER_URL)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Generated/Ferventio.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/FerventioShared.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ferventio.app
        FERVENTIO_SERVER_URL: https://ferventio.godive.dev
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

name: Ferventio

options:
  bundleIdPrefix: io.ferventio
  deploymentTarget:
    iOS: "16.0"

targets:
  Ferventio:
    type: application
    platform: iOS
    sources:
      - path: Sources
    preBuildScripts:
      - name: Verify release privacy metadata
        script: |
          cd "$SRCROOT/.."
          sh ./iosApp/Scripts/verify-privacy-configuration.sh
        basedOnDependencyAnalysis: false
      - name: Build shared Kotlin framework
        script: |
          cd "$SRCROOT/.."
          case "$SDK_NAME" in
            iphonesimulator*) KOTLIN_FRAMEWORK_TARGET=IosSimulatorArm64 ;;
            iphoneos*) KOTLIN_FRAMEWORK_TARGET=IosArm64 ;;
            *)
              echo "Unsupported Apple SDK for FerventioShared: $SDK_NAME" >&2
              exit 1
              ;;
          esac
          ./gradlew \
            ":shared:link${CONFIGURATION}Framework${KOTLIN_FRAMEWORK_TARGET}" \
            --no-configuration-cache \
            --stacktrace
        basedOnDependencyAnalysis: false
      - name: Sync Compose resources
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:syncComposeResourcesForIos --no-configuration-cache --stacktrace
        basedOnDependencyAnalysis: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Ferventio
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Ferventio OAuth
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
        CADisableMinimumFrameDurationOnPhone: true
        FerventioServerURL: $(FERVENTIO_SERVER_URL)
        FerventioAppWebsiteURL: $(FERVENTIO_APP_WEBSITE_URL)
        FerventioAppGitHubURL: $(FERVENTIO_APP_GITHUB_URL)
        FerventioAppTelegramChannelURL: $(FERVENTIO_APP_TELEGRAM_CHANNEL_URL)
        FerventioAppTelegramChatURL: $(FERVENTIO_APP_TELEGRAM_CHAT_URL)
        FerventioAppTranslationsURL: $(FERVENTIO_APP_TRANSLATIONS_URL)
        FerventioPrivacyOperatorName: $(FERVENTIO_PRIVACY_OPERATOR_NAME)
        FerventioPrivacyContact: $(FERVENTIO_PRIVACY_CONTACT)
        FerventioPrivacyPolicyURL: $(FERVENTIO_PRIVACY_POLICY_URL)
        FerventioShowPrivacyPolicyInApp: $(FERVENTIO_SHOW_PRIVACY_POLICY_IN_APP)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Generated/Ferventio.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ferventio.app
        FERVENTIO_SERVER_URL: https://ferventio.godive.dev
        FERVENTIO_APP_WEBSITE_URL: https://ferventio.godive.dev
        FERVENTIO_APP_GITHUB_URL: https://github.com/0xDive/ferventio-android
        FERVENTIO_APP_TELEGRAM_CHANNEL_URL: ""
        FERVENTIO_APP_TELEGRAM_CHAT_URL: ""
        FERVENTIO_APP_TRANSLATIONS_URL: ""
        FERVENTIO_PRIVACY_OPERATOR_NAME: ""
        FERVENTIO_PRIVACY_CONTACT: ""
        FERVENTIO_PRIVACY_POLICY_URL: ""
        FERVENTIO_SHOW_PRIVACY_POLICY_IN_APP: NO
        MARKETING_VERSION: 0.0.5
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "$(inherited) -framework FerventioShared"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/$(KOTLIN_FRAMEWORK_CONFIGURATION)"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/../shared/build/bin/iosArm64/$(KOTLIN_FRAMEWORK_CONFIGURATION)"
      configs:
        Debug:
          APS_ENVIRONMENT: development
          KOTLIN_FRAMEWORK_CONFIGURATION: debugFramework
        Release:
          APS_ENVIRONMENT: production
          KOTLIN_FRAMEWORK_CONFIGURATION: releaseFramework
